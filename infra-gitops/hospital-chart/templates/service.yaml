apiVersion: v1
kind: Service
metadata:
  name: {{ include "hospital-chart.fullname" . }}
  labels:
    {{- include "hospital-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80  # On force 80 ici pour viser Nginx à coup sûr
      protocol: TCP
      name: http
  selector:
    {{- include "hospital-chart.selectorLabels" . | nindent 4 }}